# /etc/nginx/sites-available/samian.mong.ir.conf
#
# مرحله ۱ (قبل از گرفتن SSL):
# ابتدا این فایل را با دستور زیر در Nginx فعال کنید:
#   sudo ln -s /etc/nginx/sites-available/samian.mong.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# سپس دستور سرتبوت را بزنید تا خودکار SSL را نصب کند:
#   sudo certbot --nginx -d samian.mong.ir
#
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name samian.mong.ir;

    # مسیر تاییدیه Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 50M;

    # ۱. روتینگ وب‌سرویس‌ها و API جنگو (Backend - Port 8800)
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ۲. روتینگ فایل‌های مدیا و آپلود جنگو
    location /media/ {
        alias /mnt/sda2/mong_samian/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ۳. روتینگ استاتیک جنگو (پنل ادمین جنگو)
    location /static-backend/ {
        alias /mnt/sda2/mong_samian/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ۴. روتینگ کل فرانت‌اند Next.js (Frontend - Port 3300)
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;

        # تنظیمات حیاتی برای WebSocket و Hot-Reload در Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
