# /etc/nginx/sites-available/samian.mong.ir.conf
#
# مرحله ۱ (قبل از گرفتن SSL):
# ابتدا این فایل را با دستور زیر در Nginx فعال کنید:
#   sudo ln -s /etc/nginx/sites-available/samian.mong.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# سپس دستور سرتبوت را بزنید تا خودکار SSL را نصب کند:
#   sudo certbot --nginx -d samian.mong.ir
#
# ==============================================================================

# نگاشت برای پشتیبانی همزمان از وب‌سوکت و Keep-Alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# استخر اتصالات ماندگار به فرانت‌اند Next.js
upstream nextjs_upstream {
    server 127.0.0.1:3300;
    keepalive 64;
}

# استخر اتصالات ماندگار به بک‌اند جنگو
upstream django_upstream {
    server 127.0.0.1:8800;
    keepalive 32;
}

server {
    server_name samian.mong.ir;

    # مسیر تاییدیه Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    client_max_body_size 50M;

    # ۱. روتینگ وب‌سرویس‌ها و API جنگو (Backend - Port 8800)
    location /api/ {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ۲. روتینگ فایل‌های مدیا و آپلود جنگو
    location /media/ {
        alias /mnt/sda2/mong_samian/media/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ۳. روتینگ استاتیک جنگو (پنل ادمین جنگو)
    location /static-backend/ {
        alias /mnt/sda2/mong_samian/static/;
        sendfile on;
        tcp_nopush on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ۴. روتینگ پنل ادمین جنگو
    location /django-admin/ {
        proxy_pass http://django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /img/ {
        root /mnt/sda2/mong_samian/media;
        default_type image/webp;
        try_files $uri/$mong_img_w.webp $uri/full.webp =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ۵. روتینگ فایل‌های CDN محلی
    location /cdn/ {
        alias /mnt/sda2/cdn.samian.mong.ir/public_html/wwwroot/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ۶. روتینگ کل فرانت‌اند Next.js (Frontend - Port 3300)
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # تنظیمات هوشمند برای WebSocket و Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/samian.mong.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/samian.mong.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = samian.mong.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name samian.mong.ir;
    return 404; # managed by Certbot


}
