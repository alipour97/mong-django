# Install to /etc/nginx/conf.d/mong-img-map.conf (http context).
# Maps the ?w= the frontend asks for to the nearest pre-built width
# (apps/website/images.py WIDTHS). Order matters: first match wins.
map $arg_w $mong_img_w {
    "~^([0-9]{1,2}|[12][0-9]{2}|3[0-7][0-9]|38[0-4])$"          384;
    "~^(38[5-9]|39[0-9]|[45][0-9]{2}|6[0-3][0-9]|640)$"          640;
    "~^(64[1-9]|6[5-9][0-9]|7[0-9]{2}|8[01][0-9]|82[0-8])$"      828;
    "~^(829|8[3-9][0-9]|9[0-9]{2}|10[0-7][0-9]|1080)$"           1080;
    "~^[0-9]+$"                                                  1920;
    default                                                      full;
}
