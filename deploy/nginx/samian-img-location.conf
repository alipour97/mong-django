# Add inside the "server { ... listen 443 ... }" block of
# /etc/nginx/sites-available/samian.mong.ir.conf, next to the /media/ location.
# Static pre-built WebP files; nothing is generated per request.
location /img/ {
    root /mnt/sda2/mong_samian/media;
    default_type image/webp;
    try_files $uri/$mong_img_w.webp $uri/full.webp =404;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
