# /etc/nginx/sites-available/payhub.mong.ir.conf
#
# The payment hub (apps/payhub) of both sites. It runs inside the same Django
# as the site, so there is nothing else to start: only this host and DNS.
#
# Install:
#   sudo cp deploy/nginx/payhub.mong.ir.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/payhub.mong.ir.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d payhub.mong.ir
#
# Check: https://payhub.mong.ir/__health answers "ok ...".

server {
    listen 80;
    listen [::]:80;
    server_name payhub.mong.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Only the hub's routes; the site and its panels are not served on this host.
    location ~* ^/(__health|GenerateToken|GoToPayPage|GetPaymentToken|PaymentVerification|CheckToken|zarinpal/callback|api/SnappPay)(/|$) {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # views.py trusts X-Real-IP for the server-to-server routes: always set it here, never pass the client's.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Verify may take 30 + 30 + 30 seconds (document: wait 30s, ask the status, verify again).
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    location / {
        return 404;
    }
}
